[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./addresses" }]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 5000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
robinhood = { key = "${ROBINHOOD_ETHERSCAN_KEY}", chain = 4663 }
